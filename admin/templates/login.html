<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>כניסת מנהל</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; color: #1f2937; }
        .page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .card { width: min(440px, 100%); background: white; border: 1px solid #e5e7eb; border-radius: 16px; padding: 28px; box-shadow: 0 14px 35px rgba(0,0,0,.08); }
        h1 { margin-top: 0; font-size: 28px; }
        p { line-height: 1.6; color: #4b5563; }
        label { display: block; margin: 18px 0 8px; font-weight: 700; }
        input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 16px; }
        button { width: 100%; margin-top: 18px; padding: 12px 16px; border: 0; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; background: #111827; color: white; }
        .message { margin: 12px 0; padding: 10px 12px; border-radius: 10px; }
        .message.error { background: #fee2e2; color: #991b1b; }
        .message.success { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>
    <main class="page">
        <section class="card">
            <h1>ממשק ניהול קובצי מקור</h1>
            <p>הכניסה מיועדת למנהל המערכת בלבד.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="message {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="password">סיסמה</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
                <button type="submit">כניסה</button>
            </form>
        </section>
    </main>
</body>
</html>
